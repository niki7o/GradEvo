[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gradevo"
version = "1.0.0"
description = "Matched-compute comparison of PPO (gradient RL) and NEAT (neuroevolution) on continuous control."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "GradEvo" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Make both the src layout and the tests package importable without install.
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100
